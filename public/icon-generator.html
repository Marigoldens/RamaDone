<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RamaDone Icon Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 2rem;
      min-height: 100vh;
    }
    h1 { margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 2rem;
    }
    button:hover { opacity: 0.9; }
    .status {
      background: #1e293b;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 2rem;
      font-family: monospace;
    }
    .status.success { color: #22c55e; }
    .icons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1.5rem;
    }
    .icon-card {
      text-align: center;
      padding: 1rem;
      background: #1e293b;
      border-radius: 0.75rem;
    }
    .icon-card canvas {
      border-radius: 22%;
      margin-bottom: 0.5rem;
    }
    .icon-card .name {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .icon-card .label {
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>
  <h1>🎨 RamaDone Icon Generator</h1>
  <p>Click the button to generate and download all 11 themed PNG icons. Then move them to your <code>public/icons/</code> folder.</p>
  
  <button onclick="generateAll()">Generate & Download All Icons</button>
  
  <div class="status" id="status">Ready to generate...</div>
  
  <h2 style="margin-bottom: 1rem;">Preview</h2>
  <div class="icons" id="icons"></div>

  <script>
    const themes = [
      { name: 'icon-default', color: '#2563eb', label: 'Paper White' },
      { name: 'icon-latte', color: '#fe640b', label: 'Latte' },
      { name: 'icon-dawn', color: '#ea9d34', label: 'Dawn' },
      { name: 'icon-mint', color: '#0d9488', label: 'Mint' },
      { name: 'icon-lavender', color: '#a855f7', label: 'Lavender' },
      { name: 'icon-obsidian', color: '#60a5fa', label: 'Obsidian' },
      { name: 'icon-nord', color: '#88c0d0', label: 'Nord' },
      { name: 'icon-tokyo', color: '#7aa2f7', label: 'Tokyo Night' },
      { name: 'icon-dracula', color: '#ff79c6', label: 'Dracula' },
      { name: 'icon-gruvbox', color: '#fe8019', label: 'Gruvbox' },
      { name: 'icon-blade', color: '#dc2626', label: 'Blade' },
    ];

    function generateIcon(color, size = 192) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      const radius = size * 0.22;
      
      // Rounded rectangle
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      
      // Fill with color
      ctx.fillStyle = color;
      ctx.fill();
      
      // Subtle gradient overlay
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, 'rgba(255,255,255,0.15)');
      gradient.addColorStop(1, 'rgba(0,0,0,0.1)');
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // Diamond shape
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.95;
      const cx = size / 2, cy = size / 2, s = size * 0.28;
      
      ctx.beginPath();
      ctx.moveTo(cx, cy - s);
      ctx.quadraticCurveTo(cx + s * 0.3, cy - s * 0.3, cx + s, cy);
      ctx.quadraticCurveTo(cx + s * 0.3, cy + s * 0.3, cx, cy + s);
      ctx.quadraticCurveTo(cx - s * 0.3, cy + s * 0.3, cx - s, cy);
      ctx.quadraticCurveTo(cx - s * 0.3, cy - s * 0.3, cx, cy - s);
      ctx.closePath();
      ctx.fill();
      
      // Center highlight
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fill();
      
      return canvas;
    }

    function downloadIcon(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function generateAll() {
      const status = document.getElementById('status');
      status.className = 'status';
      status.textContent = 'Generating icons...';
      
      let count = 0;
      themes.forEach((theme, i) => {
        setTimeout(() => {
          const canvas = generateIcon(theme.color, 192);
          downloadIcon(canvas, `${theme.name}.png`);
          count++;
          status.textContent = `✅ Downloaded ${count}/${themes.length}: ${theme.name}.png`;
          if (count === themes.length) {
            status.className = 'status success';
            status.textContent = `✅ All ${themes.length} icons downloaded! Move them to public/icons/ folder.`;
          }
        }, i * 200);
      });
    }

    // Show previews
    const container = document.getElementById('icons');
    themes.forEach(theme => {
      const card = document.createElement('div');
      card.className = 'icon-card';
      
      const canvas = generateIcon(theme.color, 96);
      canvas.style.width = '72px';
      canvas.style.height = '72px';
      
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = theme.label;
      
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = `${theme.name}.png`;
      
      card.appendChild(canvas);
      card.appendChild(label);
      card.appendChild(name);
      container.appendChild(card);
    });
  </script>
</body>
</html>
